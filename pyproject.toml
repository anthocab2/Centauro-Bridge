[project]
name = "centauro-bridge"
version = "0.1.0"
description = "Centauro Bridge: independent, persistent Massive to Atlas extraction jobs."
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28.1",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "portalocker>=3.2,<4",
    "psutil>=7,<8",
    "streamlit>=1.50,<2",
    "plotly>=6,<8",
    "pandas>=2.2,<3",
]

[project.scripts]
centauro-bridge = "centauro_atlas_bridge.application.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centauro_atlas_bridge"]

[dependency-groups]
dev = [
    "mongomock>=4.3,<5",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
